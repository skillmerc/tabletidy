<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabletidy</title>
  <link rel="stylesheet" href="./ui.css" />
  <link rel="stylesheet" href="./sidepanel.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Tabletidy</div>
  </header>

  <div class="tt tt-box" id="scan-card">
    <section class="card" id="step-scan">
      <h2><span class="num">1</span>Pick a table</h2>
      <button id="scan" class="btn primary">Scan this page</button>
      <p id="scan-msg" class="muted small" role="status"></p>
      <ul id="tables" class="tables"></ul>
    </section>
  </div>

  <!-- Status, Tidy, result and export: the same view as the hosted playground (app.js). -->
  <div class="tt-box"><div id="tt-app"></div></div>

  <details class="settings">
    <summary>Settings</summary>
    <label class="small">App Check debug token (needed for the cloud model only)
      <input id="token" type="password" autocomplete="off" placeholder="paste token, stored in this browser only" />
    </label>
    <button id="save-token" class="btn ghost small">Save</button>
    <p class="muted small">Cloud runs use Gemini through Firebase AI Logic. On-device runs use Gemini Nano built into Chrome.</p>
  </details>

  <script type="module" src="./sidepanel.js"></script>
</body>
</html>
